<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12405f">
<title>Italy 2026</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇮🇹</text></svg>">
<style>
/* ── Majolica: Vietri & Sicilian ceramic glaze ────────────────────
   chalk white glaze ground · cobalt blue · ochre yellow           */
:root{
  --glaze:#f4f2ec; --tile:#fffefb; --ink:#16232c; --soft:#5f6b73;
  --edge:#dfdbd0;
  --blu:#175d8c; --blu-tint:#e3ecf3;
  --ochre:#9d7318; --ochre-tint:#f4ebd6;
  --coral:#a8452a; --coral-tint:#f6e7e1;
  --lift:0 1px 1px rgba(22,35,44,.05), 0 8px 22px rgba(22,35,44,.06);
  --serif:"Iowan Old Style","Charter",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --glaze:#0f1920; --tile:#17242d; --ink:#e7edf1; --soft:#95a3ac;
    --edge:#25353f;
    --blu:#79b6dc; --blu-tint:#14303f;
    --ochre:#dcb264; --ochre-tint:#2c2618;
    --coral:#e08a6d; --coral-tint:#33201a;
    --lift:0 1px 1px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --glaze:#0f1920; --tile:#17242d; --ink:#e7edf1; --soft:#95a3ac;
  --edge:#25353f;
  --blu:#79b6dc; --blu-tint:#14303f;
  --ochre:#dcb264; --ochre-tint:#2c2618;
  --coral:#e08a6d; --coral-tint:#33201a;
  --lift:0 1px 1px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.3);
}
:root[data-theme="light"]{
  --glaze:#f4f2ec; --tile:#fffefb; --ink:#16232c; --soft:#5f6b73;
  --edge:#dfdbd0;
  --blu:#175d8c; --blu-tint:#e3ecf3;
  --ochre:#9d7318; --ochre-tint:#f4ebd6;
  --coral:#a8452a; --coral-tint:#f6e7e1;
  --lift:0 1px 1px rgba(22,35,44,.05), 0 8px 22px rgba(22,35,44,.06);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--glaze); color:var(--ink);
  font:16px/1.55 var(--sans);
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}

/* ── Masthead: painted tile band ───────────────────────────────── */
.masthead{
  background:#12405f; color:#fdfbf6;
  padding:calc(env(safe-area-inset-top) + 26px) 0 24px;
  text-align:center; position:relative; overflow:hidden;
}
.masthead::after{ /* ochre glaze line, like a tile border */
  content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,#c8912e 0 18%,#12405f 18% 22%,#c8912e 22% 40%,#12405f 40% 44%,#c8912e 44% 100%);
  opacity:.85;
}
.masthead h1{
  margin:0;font-family:var(--serif);font-weight:400;
  font-size:34px;line-height:1.05;letter-spacing:-.4px;
}
.masthead .kicker{
  font-family:var(--mono);font-size:11px;letter-spacing:2.4px;text-transform:uppercase;
  opacity:.72;margin-bottom:9px;
}
.masthead .dates{
  margin-top:9px;font-family:var(--mono);font-size:12.5px;letter-spacing:.6px;opacity:.8;
}

/* ── Control bar ───────────────────────────────────────────────── */
.controls{
  position:sticky;top:0;z-index:50;
  background:var(--glaze);border-bottom:1px solid var(--edge);
}
.controls .wrap{padding-top:9px;padding-bottom:9px;display:flex;gap:8px}
select,input[type=search]{
  -webkit-appearance:none;appearance:none;width:100%;
  font:600 16px/1.2 var(--sans);color:var(--ink);
  background:var(--tile);border:1px solid var(--edge);border-radius:4px;
  padding:13px 36px 13px 12px;min-height:48px;
}
select{
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23175d8c' stroke-width='2.5' stroke-linecap='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 11px center;background-size:16px;
  flex:1 1 58%;
}
input[type=search]{
  flex:1 1 42%;font-weight:400;padding-right:12px;padding-left:34px;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235f6b73' stroke-width='2' stroke-linecap='round'%3E%3Ccircle cx='11' cy='11' r='7'/%3E%3Cpath d='M20 20l-3.5-3.5'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:11px center;background-size:15px;
}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none}
select:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible,button:focus-visible{
  outline:2px solid var(--blu);outline-offset:2px;
}

/* ── Itinerary table ───────────────────────────────────────────── */
.plan{margin-top:18px;border:1px solid var(--edge);background:var(--tile);box-shadow:var(--lift)}
.plan h2{
  margin:0;padding:13px 14px 11px;font-family:var(--serif);font-weight:400;font-size:19px;
  border-bottom:1px solid var(--edge);
}
.leg{display:flex;align-items:baseline;gap:11px;padding:11px 14px;border-bottom:1px solid var(--edge)}
.leg .no{
  font-family:var(--mono);font-size:11px;font-weight:700;color:var(--blu);
  flex:0 0 auto;width:16px;
}
.leg .when{font-family:var(--mono);font-size:12px;color:var(--soft);flex:0 0 76px;white-space:nowrap;font-variant-numeric:tabular-nums}
.leg .where{flex:1;font-weight:600;font-size:14.5px}
.leg .cost{font-family:var(--mono);font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.leg.sum{border-bottom:0;background:var(--blu-tint)}
.leg.sum .where,.leg.sum .cost{color:var(--blu);font-weight:700}
.leg.sum .when{color:var(--blu)}

/* ── City ──────────────────────────────────────────────────────── */
section{scroll-margin-top:74px;margin-top:34px}
.city{background:var(--tile);border:1px solid var(--edge);box-shadow:var(--lift)}
.city .pad{padding:16px 15px 15px;display:flex;gap:13px}
.stopno{
  flex:0 0 auto;width:34px;height:34px;background:#12405f;color:#fdfbf6;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:14px;font-weight:700;
}
:root[data-theme="dark"] .stopno{background:var(--blu);color:#0f1920}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stopno{background:var(--blu);color:#0f1920}}
.city h2{margin:0;font-family:var(--serif);font-weight:400;font-size:27px;line-height:1.1;text-wrap:balance}
.city .region{font-family:var(--mono);font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--ochre);margin-bottom:3px}
.city p.intro{margin:7px 0 0;font-size:14px;color:var(--soft)}

.stay{border-top:1px solid var(--edge);background:var(--blu-tint);padding:12px 15px}
.stay .row{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;font-family:var(--mono);font-size:12.5px}
.stay .dates{color:var(--blu);font-weight:700;letter-spacing:.2px}
.stay .n{color:var(--soft)}
.stay .cost{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.stay .hotel{margin-top:6px;font-size:13.5px;font-weight:700}
.stay .sub{margin-top:2px;font-size:12.5px;color:var(--soft)}
.stay dl{margin:9px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px}
.stay dt{font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--soft);padding-top:2px}
.stay dd{margin:0}

/* ── Flights ───────────────────────────────────────────────────── */
.flights{margin-top:14px;border:1px solid var(--edge);background:var(--tile);box-shadow:var(--lift)}
.flights h2{margin:0;padding:13px 14px 11px;font-family:var(--serif);font-weight:400;font-size:19px;border-bottom:1px solid var(--edge)}
.fdir{padding:11px 14px;border-bottom:1px solid var(--edge)}
.fdir:last-child{border-bottom:0}
.fdir .lbl{font-family:var(--mono);font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ochre)}
.fdir .day{font-size:14px;font-weight:700;margin-top:2px}
.hop{display:flex;align-items:baseline;gap:9px;margin-top:9px;font-size:13px}
.hop .code{font-family:var(--mono);font-size:10.5px;color:var(--blu);font-weight:700;flex:0 0 52px}
.hop .path{flex:1;font-weight:600}
.hop .time{font-family:var(--mono);font-size:11.5px;color:var(--soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.hop .sub{grid-column:2;font-size:11.5px;color:var(--soft)}
.hopsub{margin:2px 0 0 61px;font-size:11.5px;color:var(--soft)}
.fmeta{margin-top:9px;padding-top:8px;border-top:1px dotted var(--edge);font-size:12px;color:var(--soft)}

/* ── Groups ────────────────────────────────────────────────────── */
details.grp{background:var(--tile);border:1px solid var(--edge);border-top:0;box-shadow:var(--lift)}
details.grp>summary{
  list-style:none;cursor:pointer;padding:14px 15px;min-height:52px;
  display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;
}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .n{
  margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--soft);
  border:1px solid var(--edge);padding:2px 6px;
}
details.grp>summary .chev{color:var(--blu);font-size:11px;transition:transform .18s}
@media (prefers-reduced-motion:reduce){details.grp>summary .chev{transition:none}}
details.grp[open]>summary .chev{transform:rotate(180deg)}

/* ── Items ─────────────────────────────────────────────────────── */
.item{padding:14px 15px;border-top:1px solid var(--edge)}
.item .hd{display:flex;gap:10px;align-items:flex-start}
.item h3{margin:0;flex:1;font-size:15.5px;line-height:1.32;font-weight:700}
.item p{margin:6px 0 0;font-size:13.5px;line-height:1.55;color:var(--soft)}
.star{
  flex:0 0 auto;background:none;border:0;font-size:19px;line-height:1;cursor:pointer;
  padding:2px 0 2px 4px;color:var(--soft);opacity:.4;transition:.15s;
}
@media (prefers-reduced-motion:reduce){.star{transition:none}}
.star[aria-pressed="true"]{color:var(--ochre);opacity:1}
.tag{
  display:inline-block;font-family:var(--mono);font-size:9.5px;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;padding:3px 6px;margin-right:7px;vertical-align:2px;
}
.t-must{background:var(--blu-tint);color:var(--blu)}
.t-book{background:var(--ochre-tint);color:var(--ochre)}
.t-check{background:var(--coral-tint);color:var(--coral)}
.out{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.out a{
  text-decoration:none;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.4px;
  color:var(--blu);border:1px solid var(--edge);background:var(--glaze);
  padding:8px 10px;min-height:34px;display:inline-flex;align-items:center;
}
.out a:hover{border-color:var(--blu)}
.item.avoid{background:var(--coral-tint)}
.item.avoid h3{color:var(--coral)}

ol.prio{margin:0;padding:6px 15px 16px 36px}
ol.prio li{margin:8px 0;font-size:14.5px}
ol.prio li::marker{font-family:var(--mono);font-size:12px;color:var(--blu)}
.aside{
  margin:0 15px 16px;padding:12px 13px;background:var(--ochre-tint);
  border-left:3px solid var(--ochre);font-size:13.5px;line-height:1.55;
}
.aside b{color:var(--ochre)}

.foot{
  text-align:center;color:var(--soft);font-family:var(--mono);font-size:11px;
  letter-spacing:.5px;line-height:2;padding:38px 16px 46px;
}
.none{display:none;text-align:center;color:var(--soft);padding:44px 16px;font-size:14px}
.up{
  position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:60;
  width:44px;height:44px;border:1px solid var(--edge);background:var(--tile);
  color:var(--blu);font-size:16px;box-shadow:var(--lift);cursor:pointer;
  display:none;align-items:center;justify-content:center;
}
</style>
</head>

/* ═══════════════════ RENDER ═══════════════════ */
const enc = encodeURIComponent;
const TAGS = { must:['t-must','Top pick'], book:['t-book','Book ahead'], check:['t-check','Verify'] };
const dm = d => '9/' + d.replace(/^\w{3} /,'').replace(' Sep','');

const app  = document.getElementById('app');
const jump = document.getElementById('jump');

jump.innerHTML = '<option value="">Jump to…</option>' +
  TRIP.map((c,i)=>`<option value="${c.id}">${i+1}. ${c.name}</option>`).join('');

const totalCost = TRIP.reduce((s,c)=> s + Number(c.stay.cost.replace(/[^0-9.]/g,'')), 0);
const totalN    = TRIP.reduce((s,c)=> s + c.stay.nights, 0);
document.getElementById('plan').innerHTML =
  '<h2>Where you are, when</h2>' +
  TRIP.map((c,i)=>`<a class="leg" href="#${c.id}" style="text-decoration:none;color:inherit">
      <span class="no">${i+1}</span>
      <span class="when">${dm(c.stay.in)}–${dm(c.stay.out)}</span>
      <span class="where">${c.name}</span>
      <span class="cost">${c.stay.cost}</span>
    </a>`).join('') +
  `<div class="leg sum"><span class="no"></span><span class="when">${totalN} nts</span>
     <span class="where">Lodging total</span><span class="cost">$${totalCost.toLocaleString()}</span></div>`;

document.getElementById('flights').innerHTML =
  '<h2>Flights</h2>' +
  FLIGHTS.map(f=>`<div class="fdir">
      <div class="lbl">${f.label}</div>
      <div class="day">${f.day}</div>
      ${f.hops.map(h=>`<div class="hop">
          <span class="code">${h.code}</span>
          <span class="path">${h.path}</span>
          <span class="time">${h.dep} → ${h.arr}</span>
        </div>
        <div class="hopsub">${h.sub}</div>`).join('')}
      <div class="fmeta">${f.meta}</div>
    </div>`).join('');

let fav = {};
try { fav = JSON.parse(localStorage.getItem('italy2026-fav')||'{}'); } catch(e){ fav = {}; }

app.innerHTML = TRIP.map((city,ci)=>{
  const s = city.stay;
  const stayLinks = (s.url ? `<a href="${s.url}" target="_blank" rel="noopener">BOOKING</a>` : '') +
    `<a href="https://www.google.com/maps/search/?api=1&query=${enc(s.addr ? s.addr+', Italy' : s.hotel+', '+city.name+', Italy')}" target="_blank" rel="noopener">${s.addr?'DIRECTIONS':'MAP'}</a>`;
  const stayRows = (s.addr ? [['Address', s.addr]] : []).concat(s.rows || []);

  const groups = city.groups.map((g,gi)=>{
    let body = '';
    if (g.prio){
      body = '<ol class="prio">' + g.prio.map(p=>`<li>${p}</li>`).join('') + '</ol>';
      if (g.note) body += `<div class="aside">${g.note}</div>`;
    } else {
      body = g.items.map(it=>{
        const key = city.id+'|'+it.n;
        const query = it.q || (it.n+', '+city.name+', Italy');
        const tag = it.tag ? `<span class="tag ${TAGS[it.tag][0]}">${TAGS[it.tag][1]}</span>` : '';
        return `<div class="item${it.avoid?' avoid':''}" data-s="${(it.n+' '+it.d).toLowerCase().replace(/["“”]/g,'')}">
          <div class="hd">
            <h3>${tag}${it.n}</h3>
            <button class="star" data-k="${key}" aria-pressed="${fav[key]?'true':'false'}" aria-label="Save ${it.n}">${fav[key]?'★':'☆'}</button>
          </div>
          <p>${it.d}</p>
          <div class="out">
            <a href="https://www.google.com/maps/search/?api=1&query=${enc(query)}" target="_blank" rel="noopener">MAP</a>
            <a href="https://www.google.com/search?tbm=isch&q=${enc(query)}" target="_blank" rel="noopener">PHOTOS</a>
            <a href="https://www.google.com/search?q=${enc(query)}" target="_blank" rel="noopener">INFO</a>
          </div>
        </div>`;
      }).join('');
    }
    const count = g.prio ? g.prio.length : g.items.length;
    return `<details class="grp"${gi===0?' open':''}>
      <summary><span>${g.title}</span><span class="n">${count}</span><span class="chev">▼</span></summary>
      ${body}
    </details>`;
  }).join('');

  return `<section id="${city.id}">
    <div class="city">
      <div class="pad">
        <div class="stopno">${ci+1}</div>
        <div>
          <div class="region">${city.region}</div>
          <h2>${city.name}</h2>
          <p class="intro">${city.intro}</p>
        </div>
      </div>
      <div class="stay">
        <div class="row">
          <span class="dates">${s.in} → ${s.out}</span>
          <span class="n">${s.nights} night${s.nights>1?'s':''}</span>
          <span class="cost">${s.cost}</span>
        </div>
        <div class="hotel">${s.hotel}</div>
        ${s.sub ? `<div class="sub">${s.sub}</div>` : ''}
        ${stayRows.length ? '<dl>'+stayRows.map(r=>`<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('')+'</dl>' : ''}
        <div class="out">${stayLinks}</div>
      </div>
    </div>
    ${groups}
  </section>`;
}).join('');

/* ═══════════════════ BEHAVIOR ═══════════════════ */
jump.addEventListener('change', e=>{
  const el = document.getElementById(e.target.value);
  if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
  e.target.selectedIndex = 0;
});

app.addEventListener('click', e=>{
  const b = e.target.closest('.star');
  if (!b) return;
  const on = b.getAttribute('aria-pressed') === 'true';
  b.setAttribute('aria-pressed', on ? 'false' : 'true');
  b.textContent = on ? '☆' : '★';
  if (on) delete fav[b.dataset.k]; else fav[b.dataset.k] = 1;
  try { localStorage.setItem('italy2026-fav', JSON.stringify(fav)); } catch(e){}
});

const q = document.getElementById('q');
const none = document.getElementById('none');
const plan = document.getElementById('plan');
q.addEventListener('input', ()=>{
  const t = q.value.trim().toLowerCase();
  plan.style.display = t ? 'none' : '';
  let hitsAll = 0;
  document.querySelectorAll('section').forEach(sec=>{
    let secHits = 0;
    sec.querySelectorAll('details.grp').forEach(g=>{
      let hits = 0;
      g.querySelectorAll('.item').forEach(it=>{
        const ok = !t || it.dataset.s.includes(t);
        it.style.display = ok ? '' : 'none';
        if (ok) hits++;
      });
      if (g.querySelector('ol.prio')) { g.style.display = t ? 'none' : ''; return; }
      g.style.display = hits ? '' : 'none';
      if (t) g.open = hits > 0;
      secHits += hits;
    });
    sec.style.display = (!t || secHits) ? '' : 'none';
    hitsAll += secHits;
  });
  none.style.display = (t && !hitsAll) ? 'block' : 'none';
});

const up = document.getElementById('up');
addEventListener('scroll', ()=>{ up.style.display = scrollY > 700 ? 'flex' : 'none'; }, {passive:true});
up.addEventListener('click', ()=> scrollTo({top:0, behavior:'smooth'}));
</script>
</body>
</html>
