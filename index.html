<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b475d">
<title>Italy 2026</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇮🇹</text></svg>">
<style>
/* ── Limoncello ────────────────────────────────────────────────────
   BARLEY #fff5d0 · NAPLES #fad564 · NEPTUNE #8ebd9d
   LIGHT OLIVE #b4bd62 · RHINO #1b475d
   Rhino carries the structure — headers, type, the deep water below
   the terrace. Naples lemon is the accent and is spent only on what
   matters most. Neptune marks what is settled; olive, what is not.  */
:root{
  --paper:#f5f2ea; --card:#fffefb; --ink:#16323f; --soft:#61767c;
  --edge:#e3ddd0; --hair:#eee9de;
  --rhino:#1b475d;  --rhino-tint:#e0e9ee;
  --lemon:#fad564;  --lemon-tint:#fdf0c2; --lemon-deep:#7e6011;
  --sage:#8ebd9d;   --sage-tint:#e7f1ea;  --sage-deep:#3a6f53;
  --olive:#b4bd62;  --olive-tint:#eff1d8; --olive-deep:#65702a;
  --rust:#a85c3c;   --rust-tint:#f8e6dd;
  --lift:0 1px 1px rgba(22,50,63,.05), 0 10px 30px rgba(22,50,63,.07);
  --serif:"Iowan Old Style","Charter",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0e1f28; --card:#152c37; --ink:#f1f5ea; --soft:#93aab0;
    --edge:#254250; --hair:#1c3542;
    --rhino:#8fc0d6;  --rhino-tint:#152f3d;
    --lemon:#fad564;  --lemon-tint:#33290d; --lemon-deep:#fad564;
    --sage:#8ebd9d;   --sage-tint:#16302a;  --sage-deep:#8ebd9d;
    --olive:#b4bd62;  --olive-tint:#2a2d14; --olive-deep:#b4bd62;
    --rust:#d98f6e;   --rust-tint:#31201a;
    --lift:0 1px 1px rgba(0,0,0,.42), 0 10px 30px rgba(0,0,0,.34);
  }
}
:root[data-theme="dark"]{
  --paper:#0e1f28; --card:#152c37; --ink:#f1f5ea; --soft:#93aab0;
  --edge:#254250; --hair:#1c3542;
  --rhino:#8fc0d6;  --rhino-tint:#152f3d;
  --lemon:#fad564;  --lemon-tint:#33290d; --lemon-deep:#fad564;
  --sage:#8ebd9d;   --sage-tint:#16302a;  --sage-deep:#8ebd9d;
  --olive:#b4bd62;  --olive-tint:#2a2d14; --olive-deep:#b4bd62;
  --rust:#d98f6e;   --rust-tint:#31201a;
  --lift:0 1px 1px rgba(0,0,0,.42), 0 10px 30px rgba(0,0,0,.34);
}
:root[data-theme="light"]{
  --paper:#f5f2ea; --card:#fffefb; --ink:#16323f; --soft:#61767c;
  --edge:#e3ddd0; --hair:#eee9de;
  --rhino:#1b475d;  --rhino-tint:#e0e9ee;
  --lemon:#fad564;  --lemon-tint:#fdf0c2; --lemon-deep:#7e6011;
  --sage:#8ebd9d;   --sage-tint:#e7f1ea;  --sage-deep:#3a6f53;
  --olive:#b4bd62;  --olive-tint:#eff1d8; --olive-deep:#65702a;
  --rust:#a85c3c;   --rust-tint:#f8e6dd;
  --lift:0 1px 1px rgba(22,50,63,.05), 0 10px 30px rgba(22,50,63,.07);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:16px/1.6 var(--sans);
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:700px;margin:0 auto;padding:0 16px}

/* ── Masthead ──────────────────────────────────────────────────── */
.masthead{
  background:#1b475d; color:#fff5d0;
  padding:calc(env(safe-area-inset-top) + 34px) 0 30px;
  text-align:center;
}
.masthead h1{
  margin:0;font-family:var(--serif);font-weight:400;
  font-size:40px;line-height:1.02;letter-spacing:-.6px;
}
.masthead .kicker{
  font-family:var(--mono);font-size:10px;letter-spacing:3.4px;text-transform:uppercase;
  color:#fad564;opacity:.85;margin-bottom:14px;
}
.masthead .dates{
  margin:12px 0 0;font-family:var(--serif);font-style:italic;font-size:15px;
  letter-spacing:.3px;opacity:.7;
}
.awning{ /* scalloped valance, like the edge of a terrace awning */
  height:13px;
  background-image:radial-gradient(circle at 50% 0, #1b475d 10px, transparent 10.5px);
  background-size:20px 13px;
  background-repeat:repeat-x;
}

/* ── Control bar ───────────────────────────────────────────────── */
.controls{
  position:sticky;top:0;z-index:50;
  background:rgba(245,242,234,.94);
  -webkit-backdrop-filter:saturate(180%) blur(12px);
  backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--edge);
}
@media (prefers-color-scheme:dark){.controls{background:rgba(14,31,40,.94)}}
:root[data-theme="dark"] .controls{background:rgba(14,31,40,.94)}
:root[data-theme="light"] .controls{background:rgba(245,242,234,.94)}
.controls .wrap{padding-top:10px;padding-bottom:10px;display:flex;gap:9px}
select,input[type=search]{
  -webkit-appearance:none;appearance:none;width:100%;
  font:500 16px/1.2 var(--sans);color:var(--ink);
  background:var(--card);border:1px solid var(--edge);border-radius:2px;
  padding:13px 34px 13px 13px;min-height:48px;
}
select{
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231b475d' stroke-width='1.8' stroke-linecap='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 12px center;background-size:15px;
  flex:1 1 58%;letter-spacing:.1px;
}
input[type=search]{
  flex:1 1 42%;font-weight:400;padding-right:12px;padding-left:34px;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2361767c' stroke-width='1.8' stroke-linecap='round'%3E%3Ccircle cx='11' cy='11' r='7'/%3E%3Cpath d='M20 20l-3.5-3.5'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:12px center;background-size:15px;
}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none}
select:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible,button:focus-visible{
  outline:2px solid var(--rhino);outline-offset:2px;
}

/* ── Panels ────────────────────────────────────────────────────── */
.plan,.flights,.city,details.grp{background:var(--card);border:1px solid var(--edge)}
.plan{margin-top:22px;box-shadow:var(--lift)}
.flights{margin-top:16px;box-shadow:var(--lift)}
.plan h2,.flights h2{
  margin:0;padding:16px 16px 13px;border-bottom:1px solid var(--edge);
  font-family:var(--serif);font-weight:400;font-size:21px;letter-spacing:-.2px;
}
.leg{display:flex;align-items:baseline;gap:12px;padding:12px 16px;border-bottom:1px solid var(--hair)}
.leg .no{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--lemon-deep);flex:0 0 auto;width:14px}
.leg .when{font-family:var(--mono);font-size:11.5px;color:var(--soft);flex:0 0 76px;white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.leg .where{flex:1;font-weight:500;font-size:14.5px;letter-spacing:.1px}
.leg .cost{font-family:var(--mono);font-size:11.5px;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.leg.sub{background:var(--paper)}
.leg.sub .where,.leg.sub .cost,.leg.sub .when{font-weight:700;color:var(--ink)}
.leg.sum{border-bottom:0;background:#1b475d}
.leg.sum .where{font-weight:600;color:#fff5d0}
.leg.sum .cost{color:#fad564;font-weight:700;font-size:13px}
.leg.sum .when{color:rgba(255,245,208,.6)}
.planfoot{padding:11px 16px 13px;font-size:11.5px;color:var(--soft);border-top:1px solid var(--hair);line-height:1.6}

/* ── Flights ───────────────────────────────────────────────────── */
.fdir{padding:14px 16px;border-bottom:1px solid var(--hair)}
.fdir:last-child{border-bottom:0}
.fdir .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:2.4px;text-transform:uppercase;color:var(--lemon-deep)}
.fdir .day{font-family:var(--serif);font-size:17px;font-weight:400;margin-top:3px;letter-spacing:-.1px}
.hop{display:flex;align-items:baseline;gap:10px;margin-top:11px;font-size:13.5px}
.hop .code{font-family:var(--mono);font-size:10px;color:var(--rhino);font-weight:700;flex:0 0 50px;letter-spacing:.3px}
.hop .path{flex:1;font-weight:500}
.hop .time{font-family:var(--mono);font-size:11px;color:var(--soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.hopsub{margin:3px 0 0 60px;font-size:11.5px;color:var(--soft);line-height:1.55}
.fmeta{margin-top:11px;padding-top:10px;border-top:1px solid var(--hair);font-size:12.5px;color:var(--soft);line-height:1.6}

/* ── City ──────────────────────────────────────────────────────── */
section{scroll-margin-top:74px;margin-top:42px}
.city{box-shadow:var(--lift)}
.city .pad{padding:22px 17px 20px;display:flex;gap:15px;background:#1b475d}
.stopno{
  flex:0 0 auto;width:36px;height:36px;background:#fad564;color:#1b475d;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:17px;font-weight:400;
}
.city h2{margin:0;font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.08;letter-spacing:-.5px;text-wrap:balance;color:#fff5d0}
.city .region{font-family:var(--mono);font-size:9.5px;letter-spacing:2.6px;text-transform:uppercase;color:#fad564;margin-bottom:5px}
.city p.intro{margin:9px 0 0;font-size:14.5px;color:rgba(255,245,208,.76);line-height:1.6}

.stay{border-top:1px solid var(--edge);background:var(--sage-tint);padding:14px 17px}
.stay .row{display:flex;flex-wrap:wrap;align-items:baseline;gap:9px;font-family:var(--mono);font-size:12px}
.stay .dates{color:var(--sage-deep);font-weight:700;letter-spacing:.2px}
.stay .n{color:var(--soft)}
.stay .cost{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.stay .hotel{margin-top:8px;font-family:var(--serif);font-size:17px;font-weight:400;letter-spacing:-.1px}
.stay .sub{margin-top:3px;font-size:12.5px;color:var(--soft);line-height:1.55}
.stay dl{margin:11px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px}
.stay dt{font-family:var(--mono);font-size:9px;letter-spacing:1.6px;text-transform:uppercase;color:var(--soft);padding-top:3px}
.stay dd{margin:0;line-height:1.5}

/* ── Groups ────────────────────────────────────────────────────── */
details.grp{margin-top:0;border-top:0;box-shadow:var(--lift)}
details.grp>summary{
  list-style:none;cursor:pointer;padding:16px 17px;min-height:54px;
  display:flex;align-items:center;gap:10px;font-weight:500;font-size:15.5px;letter-spacing:.1px;
}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .n{
  margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--soft);
  border:1px solid var(--edge);padding:3px 7px;letter-spacing:.4px;
}
details.grp>summary .chev{color:var(--rhino);font-size:10px;transition:transform .22s ease}
@media (prefers-reduced-motion:reduce){details.grp>summary .chev{transition:none}}
details.grp[open]>summary .chev{transform:rotate(180deg)}
details.grp[open]>summary{border-bottom:1px solid var(--edge)}

/* ── Items ─────────────────────────────────────────────────────── */
.item{padding:16px 17px;border-top:1px solid var(--hair)}
.item:first-of-type{border-top:0}
.item .hd{display:flex;gap:11px;align-items:flex-start}
.item h3{margin:0;flex:1;font-size:16px;line-height:1.35;font-weight:600;letter-spacing:-.1px}
.item p{margin:7px 0 0;font-size:13.5px;line-height:1.65;color:var(--soft)}
.star{
  flex:0 0 auto;background:none;border:0;font-size:18px;line-height:1;cursor:pointer;
  padding:2px 0 2px 4px;color:var(--soft);opacity:.35;transition:.18s ease;
}
@media (prefers-reduced-motion:reduce){.star{transition:none}}
.star[aria-pressed="true"]{color:var(--lemon-deep);opacity:1}
.tag{
  display:inline-block;font-family:var(--mono);font-size:9px;font-weight:700;
  letter-spacing:1.4px;text-transform:uppercase;padding:3px 7px;margin-right:8px;vertical-align:2px;
}
.t-must{background:var(--lemon);color:#4d3a05}
.t-book{background:var(--olive-tint);color:var(--olive-deep)}
.t-check{background:var(--rust-tint);color:var(--rust)}
.t-booked{background:var(--sage-tint);color:var(--sage-deep)}
:root[data-theme="dark"] .t-must{background:var(--lemon-tint);color:var(--lemon)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .t-must{background:var(--lemon-tint);color:var(--lemon)}}
.out{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.out a{
  text-decoration:none;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:1.2px;
  color:var(--rhino);border:1px solid var(--edge);background:transparent;
  padding:9px 12px;min-height:34px;display:inline-flex;align-items:center;transition:.18s ease;
}
.out a:hover{border-color:var(--rhino);background:var(--rhino-tint)}
@media (prefers-reduced-motion:reduce){.out a{transition:none}}
.item.booked-row{background:var(--sage-tint);border-left:3px solid var(--sage);padding-left:14px}
.item.booked-row h3{color:var(--sage-deep)}
.item.avoid{background:var(--rust-tint)}
.item.avoid h3{color:var(--rust)}

.dist{
  margin-top:12px;padding:11px 13px;background:var(--lemon-tint);
  border-left:2px solid var(--lemon);font-size:12.5px;line-height:1.6;color:var(--ink);
}
.dist b{
  display:block;font-family:var(--mono);font-size:9px;letter-spacing:1.8px;
  text-transform:uppercase;color:var(--lemon-deep);margin-bottom:4px;font-weight:700;
}

/* ── Phrasebook ────────────────────────────────────────────────── */
.ph{padding:14px 17px;border-top:1px solid var(--hair)}
.ph:first-of-type{border-top:0}
.ph .en{font-size:12.5px;color:var(--soft);margin-bottom:4px}
.ph .it{font-family:var(--serif);font-size:21px;line-height:1.2;font-weight:400;letter-spacing:-.2px}
.ph .say{font-family:var(--mono);font-size:10.5px;letter-spacing:1.4px;color:var(--lemon-deep);margin-top:5px;text-transform:uppercase}
.ph .tip{margin-top:7px;font-size:12.5px;color:var(--soft);font-style:italic;line-height:1.6}
.headsup{padding:15px 17px;border-top:1px solid var(--hair)}
.headsup:first-of-type{border-top:0}
.headsup h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-.1px}
.headsup p{margin:6px 0 0;font-size:13.5px;color:var(--soft);line-height:1.65}

/* ── Chrome ────────────────────────────────────────────────────── */
.foot{
  text-align:center;color:var(--soft);font-family:var(--mono);font-size:10px;
  letter-spacing:1.4px;line-height:2.2;padding:46px 16px 54px;text-transform:uppercase;
}
.none{display:none;text-align:center;color:var(--soft);padding:48px 16px;font-size:14px;font-style:italic}
.up{
  position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:60;
  width:44px;height:44px;border:1px solid var(--edge);background:var(--card);
  color:var(--rhino);font-size:15px;box-shadow:var(--lift);cursor:pointer;
  display:none;align-items:center;justify-content:center;
}
</style>
</head>
<body>

<div class="masthead">
  <div class="kicker">Sicily · Campania · Tuscany</div>
  <h1>Italy 2026</h1>
  <div class="dates">the ninth to the twenty-third of September</div>
</div>
<div class="awning"></div>

<div class="controls">
  <div class="wrap">
    <select id="jump" aria-label="Jump to a destination"></select>
    <input id="q" type="search" placeholder="Search" aria-label="Search everything">
  </div>
</div>

<div class="wrap">
  <div class="plan" id="plan"></div>
  <div class="flights" id="flights"></div>
  <main id="app"></main>
  <div class="none" id="none">Nothing matches that. Try another word.</div>
</div>

<div class="foot">
  Tap ☆ to save a favorite — kept on this device<br>
  Every entry opens in Maps, photos, or search
</div>

<button class="up" id="up" aria-label="Back to top">↑</button>

    ]},
    { title:"🏖️ Beaches & Day Trips", items:[
      {n:"Mondello Beach", d:"The city beach — white sand and turquoise water. Much of the sand is private lidos you pay for; there are free public stretches at either end.", tag:"must", q:"Mondello beach Palermo",
       dist:"About 11 km from the historic centre. Bus 806 from Piazza Politeama takes 30–40 minutes depending on traffic; a taxi is 20–25 minutes."},
      {n:"Sant'Elia, Santa Flavia", d:"Small hidden coastal village east of Palermo — a quiet fishing-harbor swimming spot rather than a beach.", q:"Sant'Elia Santa Flavia Sicily",
       dist:"About 18 km east. Train from Palermo Centrale to Santa Flavia–Solunto takes roughly 20 minutes, then a short taxi or 25-minute walk down to the harbor."}
    ]},
    { title:"🍝 Food & Sweets", items:[

      {n:"Osteria Nonna Dora", d:"Traditional Sicilian cooking — make a reservation.", tag:"book"},

{
  id:"castellammare", name:"Castellammare del Golfo", region:"Sicily",
  intro:"Beach days, coves and seafood on the northwest Sicilian coast.",
  stay:{ in:"Sat 12 Sep", out:"Mon 14 Sep", nights:2, cost:"$365",
         hotel:"Fior Di Mandorla", sub:"Room hosted by Giardino Segreto",
         addr:"V. Guglielmo Marconi 108, 91014 Castellammare del Golfo TP",
         rows:[["Check-in","Sat 12 Sep, after 3:00 PM"],["Checkout","Mon 14 Sep, by 10:00 AM"]],
         url:"https://www.airbnb.com/rooms/1434694323328877174?check_in=2026-09-12&check_out=2026-09-14&guests=1&adults=1" },
  groups:[
    { title:"🏖️ Beaches & Coves", items:[
      {n:"Cala Rossa", d:"Get in the water here — the swimming stop on your list. Pinkish-red rock, clear water, good snorkeling. Sits at Contrada Guidaloca–Ciavoli on the road out to Scopello.", tag:"must",
       dist:"Roughly 8 km toward Scopello — about 12–15 minutes by car. The easiest of the coves to reach."},
      {n:"Riserva Naturale dello Zingaro", d:"Coastal nature reserve with a string of seven swimming coves. Entry is on foot only — no road runs through it. Bring water and real shoes; there is no shade and nothing to buy inside.", tag:"must",
       dist:"South gate is about 12 km, a 20-minute drive, roughly 2 km past Scopello. That's the gate to use from here. The first cove, Cala Capreria, is a 20-minute walk in from the south gate."},
      {n:"Cala Bianca", d:"Small white-pebble cove with turquoise water, signposted off the Scopello road near Borgo Castellazzo.",
       dist:"About 10 minutes' drive toward Scopello, then roughly 700 m of unpaved track and a few minutes on foot. Most cars handle the dirt road fine, but parking is limited."},
      {n:"Cala dell'Uzzo", d:"One of the prettiest coves in the Zingaro reserve — but it sits at the far north end, not the Scopello end.",
       dist:"The catch: from the south gate it's a 7 km walk, close to 2 hours each way. It's a 10-minute walk from the north gate, but that gate is 12 km past San Vito Lo Capo — about a 1 hr 15 min drive from you. Either a full hiking day or a long drive. Cala Capreria or Cala Marinella are the realistic swims from the south gate."},
      {n:"Casa Maje Beach Club", d:"Beach club for a day or an evening by the water. Worth calling ahead even in September.", q:"Casa Maje beach club Castellammare del Golfo"}
    ]},
    { title:"🍽️ Eat & Drink", items:[
      {n:"La Tonnara (Scopello)", d:"Dinner at the old tuna fishery at Tonnara di Scopello — one of the most scenic settings on this coast. Make reservations.", tag:"book", q:"La Tonnara di Scopello restaurant",
       dist:"About 11 km, a 20-minute drive. You'll be coming back on a dark, winding coast road, so plan the drive home."},
      {n:"La Sorgente", d:"Try the cassatelle with ricotta — the fried sweet ricotta turnover that's a western-Sicily specialty.", q:"La Sorgente Castellammare del Golfo cassatelle"},
      {n:"Vernaci Gelateria", d:"Gelato stop. The spelling may differ locally — search will find it.", tag:"check", q:"gelateria Castellammare del Golfo"}
    ]},
    { title:"🚗 Getting Around", items:[
      {n:"You need a car here", d:"Every beach worth going to is on the same road southwest out of town toward Scopello. Cala Rossa at roughly 8 km, Cala Bianca around 10 minutes out, the Zingaro south gate at 12 km, and Scopello itself at 11 km — all within a 20-minute drive of the apartment, all strung along one route. Without a car you're limited to the town beach.", q:"car rental Castellammare del Golfo"},
      {n:"Parking fills early", d:"The Zingaro south gate lot and the Cala Bianca dirt track both fill by mid-morning in season. Arriving before 9:30 makes the difference between parking at the gate and parking a long walk away.", q:"Riserva dello Zingaro entrance parking"},
      {n:"Palermo → Castellammare", d:"About an hour by car on the A29. Buses also run from Palermo, but given the beaches are spread along one road out of town, picking up a rental car for these two days is the difference between seeing the coves and not.", q:"Palermo to Castellammare del Golfo bus"}
    ]}
  ]
},
{
  id:"naples", name:"Naples", region:"Campania",
  intro:"Flight over from Sicily. Base for Pompeii and Capri, and the birthplace of pizza.",
  stay:{ in:"Mon 14 Sep", out:"Thu 17 Sep", nights:3, cost:"$512",
         hotel:"Nova Plebiscito 1", sub:"Entire home/apt hosted by Silvano · one minute from Piazza del Plebiscito",
         addr:"Via Pallonetto Santa Lucia 23, 80132 Naples",
         rows:[["Check-in","Mon 14 Sep, after 4:00 PM"],["Checkout","Thu 17 Sep, by 10:00 AM"]],
         url:"https://www.airbnb.com/rooms/1348680569126395919?guests=1&adults=1" },
  groups:[
    { title:"🏛️ Day Trips", items:[
      {n:"⚠️ Naples is fully committed — here's how it falls", d:"Every day here is now spoken for, so it's worth knowing the shape of it. Monday 14th: land 6:20 PM, at the apartment by 7:30 — that's your one pizzeria dinner, and Da Michele is a 25-minute walk. Don't linger, because Tuesday starts at 6:30 AM. Tuesday 15th: Capri, 7:00 AM to 6:00 PM, eleven hours. Wednesday 16th: Pompeii 8:30 to around 1:00, then the food tour at 6:00 — the gap in between is your only real window for the city itself, and it lands you in the right quarter anyway. Thursday 17th: checkout at 10 AM for the coast.", tag:"must", q:"Naples 3 day itinerary"},
      {n:"What this means for the city sights", d:"Cappella Sansevero, Spaccanapoli, Via dei Tribunali and San Gregorio Armeno all sit in the same quarter, roughly where your Wednesday food tour meets. Doing them Wednesday afternoon between Pompeii and 6:00 PM is realistic and pleasant — book a Sansevero timed entry for about 2:30. Castel Sant'Elmo, the Charterhouse and the Pignasecca market are up on the Vomero and need their own half day, which you no longer have. Let those go unless you drop something, and don't feel bad about it — three nights in Naples with Capri and Pompeii in them was always going to mean choosing.", q:"Cappella Sansevero tickets"},
      {n:"Capri boat tour — Tue 15 Sep, 7:00 AM", d:"Booked and confirmed. Full-day Capri Island small-group boat tour from Naples — 11 hours, roughly 7:00 AM to 6:00 PM. $469.40 for two, $234.70 each, your biggest single activity. Free cancellation and unlimited rescheduling until 7:00 AM on Sep 14. Your booking reference is in your confirmation email; I've kept it off this page since the site is public. Bring more sun cover than feels necessary — eleven hours on open water in September still burns.", tag:"booked", q:"Full day Capri Island small group boat tour from Naples",
       dist:"7:00 AM meeting point, almost certainly at the port — Molo Beverello is about a 15-minute walk from the apartment, so you're leaving by 6:30. Check the exact meeting point on your voucher the night before, because the Naples port has several separate embarkation points and they are not close together."},
      {n:"Pompeii guided tour — Wed 16 Sep, 8:30 AM", d:"Booked. Skip-the-line guided tour from Naples, in English, about 3 hours 30 minutes. $139.18 for two, mobile ticket — save it to your phone before you travel. The 8:30 start is the right call: you'll be walking the site before the worst of the heat and the tour crowds. Free cancellation until 8:30 AM on Sep 15 if plans change.", tag:"booked", q:"Pompeii guided tour skip the line from Naples",
       dist:"About 25 km southeast. Confirm whether your tour includes transport from Naples or meets you at the gate — if you're getting there yourself, it's the metro to Napoli Garibaldi then the Circumvesuviana toward Sorrento to Pompei Scavi, roughly an hour door to gate. For an 8:30 start that means leaving by about 7:15."}
    ]},
    { title:"🏛️ In the City", items:[
      {n:"Cappella Sansevero", d:"Small chapel holding the Veiled Christ — a marble sculpture with a shroud carved so thin it looks like cloth. Genuinely astonishing in person and the single best thing in Naples for many visitors. Timed tickets, book online.", tag:"must", q:"Cappella Sansevero Naples",
       dist:"About 1.5 km, a 20–25 minute walk up into the old centre. Combine it with Spaccanapoli."},
      {n:"Castel Nuovo (Maschio Angioino)", d:"The five-towered medieval castle on the harbour front, with a white triumphal arch set into the dark stone. Worth seeing from outside even if you skip the museum.", q:"Castel Nuovo Maschio Angioino Naples",
       dist:"Roughly 700 m — a 10-minute walk along the waterfront. The closest major sight to the apartment."},
      {n:"Funicolare di Montesanto", d:"One of Naples' four funicular railways, climbing from the Montesanto station up to the Vomero hill. A quick ride and the easiest way up — the alternative is a long climb.", q:"Funicolare di Montesanto Naples",
       dist:"About 1.5 km to the lower station, then five minutes up. Use a normal city transit ticket."},
      {n:"Castel Sant'Elmo", d:"Star-shaped fortress crowning the Vomero hill. You go for the ramparts — a full panorama over the city, the bay and Vesuvius.", tag:"must", q:"Castel Sant'Elmo Naples",
       dist:"At the top of the Montesanto funicular, then a short uphill walk. Sits right beside the Charterhouse, so do both in one trip."},
      {n:"Charterhouse of San Martino", d:"The Certosa di San Martino — a vast Carthusian monastery next to Castel Sant'Elmo, with baroque cloisters, terraced gardens and a famous collection of Neapolitan nativity scenes.", tag:"must", q:"Certosa e Museo di San Martino Naples",
       dist:"Adjacent to Castel Sant'Elmo at the top of the funicular. Budget a half day for the pair, including the ride up."}
    ]},
    { title:"🚶 Streets & Markets", items:[
      {n:"Spaccanapoli", d:"The dead-straight lane that slices the old city in two — the name means 'Naples splitter'. Not a sight so much as the best walk in the city, lined with churches, shops and street food.", tag:"must", q:"Spaccanapoli Naples",
       dist:"About 1.2 km, a 20-minute walk uphill from the apartment. Cappella Sansevero and San Gregorio Armeno both sit just off it."},
      {n:"Via dei Tribunali", d:"The parallel street one block north — the historic decumano maggiore, and the pizza spine of Naples. Several of the city's most famous pizzerias are on or just off it.", tag:"must", q:"Via dei Tribunali Naples",
       dist:"About 1.5 km, a 25-minute walk. Easy to do as one loop with Spaccanapoli — go up one, come back down the other."},
      {n:"Via San Gregorio Armeno", d:"The nativity-scene street: a narrow lane of workshops making presepe figures year-round. Crowded, kitsch and completely unlike anywhere else.", q:"Via San Gregorio Armeno Naples",
       dist:"Runs between Spaccanapoli and Via dei Tribunali — you'll cross it walking the loop."},
      {n:"Mercato della Pignasecca", d:"Naples' oldest open-air market and a genuinely local one — fish, produce, cheese and street food, loud and unpolished. Best in the morning.", tag:"must", q:"Mercato della Pignasecca Naples",
       dist:"About 1.2 km, a 15–20 minute walk. Right by the Montesanto funicular station, so pair it with the Vomero trip."}
    ]},
    { title:"🍕 Food", items:[
      {n:"Antica Pizzeria Port'Alba", d:"Widely called the world's oldest pizzeria. Worth knowing the real story: it started in 1738 as an oven selling flatbread to street vendors, and became a sit-down pizzeria with tables in 1830. So the 1738 date is genuine, but as a restaurant it dates from 1830.", tag:"must", q:"Antica Pizzeria Port'Alba Naples",
       dist:"On Via Port'Alba near Piazza Dante, about 1.5 km — a 20-minute walk, close to the Pignasecca market."},
      {n:"L'Antica Pizzeria da Michele", d:"The most famous pizzeria in Naples — the Eat Pray Love one. Two pizzas only, margherita and marinara, and no reservations: you take a number and wait. Your 1800s note is right, with a wrinkle — the Condurro family started making pizza in 1870, Michele opened his own place in 1906, and it moved to the current Via Cesare Sersale address in 1930. Fifth generation runs it now.", tag:"must", q:"L'Antica Pizzeria da Michele Naples",
       dist:"About 2 km near Forcella, a 25-minute walk. Go at an odd hour — the queue routinely runs an hour at peak."},
      {n:"Naples pizza", d:"Napoletana pizza in its home city — worth planning one or two specific places rather than wandering.", tag:"must", q:"best pizza Naples Italy"},
      {n:"Street Food Tour — Wed 16 Sep, 6:00 PM", d:"Booked. Naples' Ultimate Street Food Tour, small group, by Do Eat Better. $153.32 for two. Expect fried pizza, sfogliatella, taralli, cuoppo and the rest. Free cancellation and unlimited rescheduling until 6:00 PM on Sep 15 — the most flexible booking you have, so it's the one to move if the day gets away from you.", tag:"booked", q:"Do Eat Better Naples street food tour",
       dist:"Meeting point comes on the voucher, normally in the centro storico around Spaccanapoli or Via dei Tribunali — a 20-minute walk up from the apartment. Since you'll already be in that quarter, it pairs naturally with an afternoon wander there."}
    ]},
    { title:"🚆 Logistics", items:[
      {n:"Flight: Palermo → Naples, 14 Sep", d:"Ryanair FR49, departing 5:20 PM and landing 6:20 PM. Seats 06A and 06B, priority boarding and two cabin bags each, Fast Track added. Check in online beforehand — Ryanair charges to do it at the airport.", q:"Ryanair FR49 Palermo Naples",
       dist:"Palermo airport is about 35 km from Castellammare, roughly a 35-minute drive. With a 10:00 AM checkout and a 5:20 PM flight, you have most of Monday free — one last swim, or lunch in Scopello on the way."},
      {n:"Naples → Amalfi Coast, 17 Sep", d:"Options are the SITA bus via Sorrento, a private transfer, or the ferry. The ferry is the least stressful and the prettiest. Details still to be added.", tag:"check", q:"Naples to Positano ferry"}
    ]}
  ]
},
{
  id:"amalfi", name:"Amalfi Coast", region:"Positano & Ravello",
  intro:"Cliffside towns above the water — the slow part of the trip.",
  stay:{ in:"Thu 17 Sep", out:"Sun 20 Sep", nights:3, cost:"$1,043",
         hotel:"Casa Lucibello", sub:"Deluxe King Studio · 2 adults · prepaid through Booking.com",
         addr:"Via G. Marconi 230, 84017 Positano",
         rows:[["Check-in","Thu 17 Sep, 2:00 – 9:00 PM"],["Checkout","Sun 20 Sep, 6:00 – 10:00 AM"]] },
  groups:[
    { title:"✨ Experiences", items:[
      {n:"⚠️ How the three days now fall", d:"Thursday 17th is a travel day — checkout in Naples at 10 AM, and you can't get into Casa Lucibello until 2 PM at the earliest. Friday 18th: cooking class 11:30 to 2:30, afternoon and evening free. Saturday 19th: boat tour 9:30 to 1:30, afternoon free. Sunday 20th: checkout at 10 AM for Florence. So both full days now have a booked activity in the middle of them, and Ravello — which really wants a whole day — no longer has one. See the Ravello entry for what's still possible.", tag:"must", q:"Positano 3 day itinerary"},
      {n:"Cooking class — Fri 18 Sep, 11:30 AM", d:"Booked. Pasta, mozzarella and tiramisu with wine, in Positano. Runs 11:30 AM to about 2:30 PM — 3 hours. $141.52 for two, mobile ticket, in English. Free cancellation until 11:30 AM on Sep 17 if anything changes.", tag:"booked", q:"Positano cooking class pasta mozzarella tiramisu",
       dist:"An 11:30 start leaves your Friday afternoon and evening free. Confirm the meeting point on your voucher — Positano classes are often up in the hills with a shuttle from town rather than down by the beach."},
      {n:"Ravello — now needs a decision", d:"Hill town above the coast with the famous garden villas, Villa Cimbrone and Villa Rufolo, and the best views on the whole coastline. With both full days now half-booked, this is the thing under pressure.", tag:"check", q:"Ravello Villa Cimbrone Villa Rufolo",
       dist:"About 15 km, but the coast road makes it 50–60 minutes by car and closer to 1.5 hours by bus with a change at Amalfi. Your realistic options: Friday afternoon straight from the cooking class, or Saturday afternoon after the boat tour — either way arriving around 4 PM by car, which gives you a couple of hours before the villa gardens close near sunset. That is enough for Villa Rufolo and the view, not for a leisurely day. The alternative is to accept Ravello as a half-day and enjoy it, or drop it and keep both afternoons in Positano. Both are defensible — just decide before you go rather than at 3 PM on the day."},
      {n:"Boat tour with snorkeling — Sat 19 Sep, 9:30 AM", d:"Booked. Amalfi Coast & Positano boat tour with snorkeling and drinks — 4 hours, so roughly 9:30 to 1:30. $304.28 for two. Free cancellation and unlimited rescheduling until 9:30 AM on Sep 18. Seeing this coastline from the water is the version people remember; the towns look completely different from below. Bring a swimsuit under your clothes and reef-safe sunscreen.", tag:"booked", q:"Amalfi Coast Positano boat tour snorkeling",
       dist:"Boats leave from Spiaggia Grande, the main beach — the same downhill walk from Via Marconi, roughly 15 minutes of stairs. For a 9:30 departure leave the apartment by about 9:00, and remember the climb back up comes after four hours in the sun."},
      {n:"Beach club", d:"Positano's beach clubs sell loungers by the day on Spiaggia Grande and Fornillo. Reserve ahead. With the boat tour on Saturday morning and the cooking class on Friday, a half day on a lounger is a realistic use of one of the free afternoons.", q:"Positano beach club Spiaggia Grande",
       dist:"Via Marconi is the upper road, so the beach is straight downhill — roughly 10–15 minutes of stairs going down and a genuinely steep climb coming back. There are local buses up if you'd rather not walk it twice."}
    ]},
    { title:"🌙 Nightlife", items:[
      {n:"Music on the Rocks", d:"Positano's one real nightclub — a room carved into the cliff at the end of Spiaggia Grande, so you're literally dancing inside the rock. Live music and DJs, dressy-ish crowd, drinks priced accordingly. The late-night option in a town that otherwise winds down early.", tag:"must", q:"Music on the Rocks Positano",
       dist:"Down at the far end of the main beach — the same downhill walk as the beach clubs, roughly 15 minutes of stairs from Via Marconi. Getting back up at 2 AM is the part to plan for; taxis and the local bus both exist."}
    ]},
    { title:"📍 Nearby", items:[
      {n:"Positano", d:"The postcard town — vertical streets, one main beach, and a great many stairs.", tag:"must", q:"Positano Italy"},
      {n:"Amalfi & Atrani", d:"The next towns along the coast — easy by ferry or bus.", q:"Amalfi town Italy"},
      {n:"Path of the Gods", d:"The Sentiero degli Dei, a cliff-top trail from Bomerano down to Positano. Big views, mostly downhill if you start from Agerola.", q:"Path of the Gods Positano hike"}
    ]},
    { title:"🚆 Logistics", items:[
      {n:"Amalfi → Naples → Florence, 20 Sep", d:"Back to Naples by ferry, bus or car, then the high-speed train — Frecciarossa or Italo — to Florence, about three hours. Book train tickets ahead for the cheaper fares.", tag:"book", q:"Naples to Florence high speed train",
       dist:"The timing works out: checkout here is 10:00 AM and Florence check-in isn't until 3:00 PM, but Dimora Collection will hold your bags if you arrive early. Allow 2–3 hours to get from Positano to Napoli Centrale before the train even starts."}
    ]}
  ]
},
{
  id:"florence", name:"Florence", region:"Tuscany",
  intro:"The Renaissance finale — art, markets, wine windows and Tuscan food.",
  stay:{ in:"Sun 20 Sep", out:"Wed 23 Sep", nights:3, cost:"$1,094",
         hotel:"Dimora Collection SRL", sub:"In Quartiere 1, the historic centre by the Duomo — every sight on your Florence list is walkable from here. Ask about check-in instructions if they haven't sent a door code.",
         addr:"Piazza dei Giuochi 1, 50122 Firenze FI",
         rows:[["Check-in","Sun 20 Sep, from 3:00 PM"],["Checkout","Wed 23 Sep, by 11:00 AM"],
               ["Luggage","They'll hold bags before check-in and after checkout"]],
         url:"https://dimoracollection.guestybookings.com/en/properties" },
  groups:[
    { title:"🍇 Wine Country", items:[
      {n:"Tuscany Wine Safari — Mon 21 Sep, 9:00 AM", d:"Booked and confirmed. Small-group full-day wine tasting tour out of Florence, lunch included. $360.88 for two, $180.44 each. A full day, so treat Monday as gone from your Florence sightseeing.", tag:"booked", q:"Small Group Wine Safaris Tuscany wine tasting tour from Florence",
       dist:"Departs from central Florence, an easy walk from Piazza dei Giuochi. Confirm the exact meeting point and time on your voucher — most Chianti tours leave from near Santa Maria Novella station."},
      {n:"This makes Paneretta redundant", d:"Your booked safari is a Chianti wine day with lunch, which is essentially what a visit to Castello della Paneretta would have been. No need to plan both — keep Paneretta as a backup only if the tour falls through.", q:"Chianti Classico wine region Tuscany"}
    ]},
    { title:"🏛️ Must-See Sights & History", items:[
      {n:"Read this before you plan the days", d:"The Uffizi and the Accademia are both closed every Monday — so your Monday wine safari is well timed, it costs you nothing museum-wise. But that leaves Sunday afternoon and Tuesday as your only museum days, and you fly out Wednesday morning. Book the Uffizi and Accademia for Tuesday 22 Sep with timed entries, and use Sunday afternoon for things that don't need tickets: the Duomo square, Ponte Vecchio, Oltrarno, Piazzale Michelangelo at sunset. Note Tuesday is also the one Cascine market day — you can't do everything, so pick.", tag:"must", q:"Uffizi Accademia Florence opening hours"},
      {n:"Florence Cathedral (Duomo)", d:"Florence's iconic cathedral, famous for Brunelleschi's massive Renaissance dome. Climbing the dome is one of the best experiences if you're comfortable with stairs.", tag:"must"},
      {n:"Piazza del Duomo", d:"The historic square surrounding the Duomo, Giotto's Bell Tower and the Baptistery. Beautifully atmospheric at night when the crowds disappear."},
      {n:"Galleria dell'Accademia", d:"Home of Michelangelo's David, one of the most famous sculptures of the Renaissance. Reserve a timed entry.", tag:"must"},
      {n:"Uffizi Gallery", d:"One of the world's most important Renaissance art museums. Look for Botticelli's Birth of Venus and works by Leonardo, Michelangelo and Raphael. Book ahead.", tag:"must"},
      {n:"Ponte Vecchio", d:"Florence's famous medieval bridge over the Arno, historically lined with jewelry shops. Great for an evening stroll.", tag:"must"},
      {n:"Piazza della Signoria", d:"Florence's historic civic center, filled with Renaissance sculptures and right next to Palazzo Vecchio and the Uffizi."},
      {n:"Medici Chapels", d:"The Cappelle Medicee — elaborate funerary chapels built for the powerful Medici family, with major works by Michelangelo."},
      {n:"Basilica di Santa Maria Novella", d:"One of Florence's most important Gothic churches, with an impressive Renaissance façade and significant artworks inside."},
      {n:"Basilica di Santa Croce", d:"Historic Franciscan basilica and burial place of famous Florentines including Michelangelo, Galileo and Machiavelli."},
      {n:"Boboli Gardens", d:"Huge historic gardens behind Palazzo Pitti. A great place to walk through Renaissance landscaping, fountains, sculptures and terraces.", tag:"must"},
      {n:"Piazzale Michelangelo", d:"The classic panoramic viewpoint over Florence. Go around sunset for one of the best city views.", tag:"must"}
    ]},
    { title:"🛍️ Markets, Shopping & Local Life", items:[
      {n:"Mercato Centrale", d:"Florence's famous indoor food market. Great for browsing Italian specialties, meats, cheeses, pasta and wine, plus casual food upstairs."},
      {n:"Sant'Ambrogio Market", d:"A more local-feeling market where Florentines shop for produce, cheese and meat. A good alternative to the more touristy Mercato Centrale."},
      {n:"Cascine Market — Tuesdays", d:"Florence's large outdoor market along the Cascine park. Good for clothing, household goods, food and bargain hunting. You're in Florence Sunday to Wednesday, so Tuesday 22 September is your only window."},
      {n:"San Lorenzo Market", d:"Known for leather goods, souvenirs, clothing and tourist shopping. Fun to browse, but compare leather quality carefully."},
      {n:"Santa Croce Market", d:"Check for local markets and events around Piazza Santa Croce — offerings vary by day.", tag:"check"},
      {n:"Vintage shopping in Oltrarno", d:"The Oltrarno and Santo Spirito neighborhood is particularly good for vintage stores, independent boutiques, antiques and more unique shopping.", tag:"must"},
      {n:"KIKO Milano", d:"Italian cosmetics brand if you want to browse Italian beauty products."},
      {n:"Castello della Paneretta", d:"Historic Chianti Classico winery built around a medieval watchtower, at Via della Paneretta 35 in Barberino Tavarnelle. A countryside wine experience rather than a city sightseeing stop.",
       dist:"About 45 km south of Florence — a 45–50 minute drive into Chianti. There's no practical public transport, so this needs a rental car or a booked tour, and it takes most of a day out of your three."}
    ]},
    { title:"🍷 Unique Florence Experiences", items:[
      {n:"Wine Windows", d:"The buchette del vino — tiny windows built into historic buildings, traditionally used to sell wine directly to customers. Florence has hundreds. Ones to find: Babae, Cantina dei Pucci, Buchetta del Vino, Caffè Odeon, Osteria Belle Donne.", tag:"must", q:"buchette del vino wine windows Florence"},
      {n:"Order the house wine", d:"At traditional trattorias the vino della casa is a cheap and fun way to drink local."},
      {n:"Red Garter Club", d:"American-style bar with dancing and nightlife if you want something more energetic after dinner."}
    ]},
    { title:"🥪 Sandwiches & Casual Food", items:[

const PHRASES = [

const CUSTOMS = [
 {h:"Coperto is not a scam", p:"Most restaurants add a €1–3 per person cover charge for bread and table service. It's printed on the menu and it's completely normal."},
 {h:"Tipping is not expected", p:"Service is included. Rounding up or leaving a couple of euros for a very good meal is generous, not required. Never 20%."},
 {h:"Greet the room", p:"Say buongiorno walking into a shop, bar or small restaurant, and arrivederci leaving. Skipping it is the main thing that reads as rude."},
 {h:"Lunch and dinner run late", p:"Kitchens generally serve lunch 12:30–2:30 and dinner from 7:30 or 8. A restaurant full at 6:30 pm is usually one aimed at tourists."},
 {h:"Sit-down costs more", p:"At cafés you pay one price standing at the bar and a higher one at a table. Both are legitimate — the menu lists both."},
 {h:"Carry some cash", p:"Cards work nearly everywhere, but small market stalls, beach clubs and rural spots can still be cash-only."},
 {h:"Set up an eSIM before you fly", p:"Buy and install a data eSIM while you're still on wifi at home — it activates when you land, so you have Maps and messaging from the airport without roaming charges. You noted \"Zero\" as the app; double-check that name, as the widely used ones are Airalo, Holafly, Saily and Nomad. Whichever you pick, install it before departure — activation needs a connection."}
];

/* ═══════════════════ RENDER ═══════════════════ */
const enc = encodeURIComponent;
const TAGS = { must:['t-must','Top pick'], book:['t-book','Book ahead'], check:['t-check','Verify'], booked:['t-booked','✓ Booked'] };
const dm = d => '9/' + d.replace(/^\w{3} /,'').replace(' Sep','');

const app  = document.getElementById('app');
const jump = document.getElementById('jump');

jump.innerHTML = '<option value="">Jump to…</option>' +
  TRIP.map((c,i)=>`<option value="${c.id}">${i+1}. ${c.name}</option>`).join('') +
  '<option value="italiano">🇮🇹 Italian phrases</option>';

const EXTRAS = [
  {when:"9/10", what:"Palermo street food tour", cost:139.18},
  {when:"9/14", what:"Flight Palermo → Naples", cost:258.94},
  {when:"9/15", what:"Capri full-day boat tour", cost:469.40},
  {when:"9/16", what:"Pompeii guided tour", cost:139.18},
  {when:"9/16", what:"Naples street food tour", cost:153.32},
  {when:"9/18", what:"Positano cooking class", cost:141.52},
  {when:"9/19", what:"Amalfi Coast boat tour", cost:304.28},
  {when:"9/21", what:"Tuscany wine safari", cost:360.88}
];
const totalCost = TRIP.reduce((s,c)=> s + Number(c.stay.cost.replace(/[^0-9.]/g,'')), 0);
const totalN    = TRIP.reduce((s,c)=> s + c.stay.nights, 0);
const grand     = totalCost + EXTRAS.reduce((s,e)=> s + e.cost, 0);
document.getElementById('plan').innerHTML =
  '<h2>Where you are, when</h2>' +
  TRIP.map((c,i)=>`<a class="leg" href="#${c.id}" style="text-decoration:none;color:inherit">
      <span class="no">${i+1}</span>
      <span class="when">${dm(c.stay.in)}–${dm(c.stay.out)}</span>
      <span class="where">${c.name}</span>
      <span class="cost">${c.stay.cost}</span>
    </a>`).join('') +
  `<div class="leg sub"><span class="no"></span><span class="when">${totalN} nts</span>
     <span class="where">Lodging</span><span class="cost">$${totalCost.toLocaleString()}</span></div>` +
  EXTRAS.map(e=>`<div class="leg"><span class="no"></span><span class="when">${e.when}</span>
     <span class="where">${e.what}</span>
     <span class="cost">$${e.cost.toFixed(2)}</span></div>`).join('') +
  `<div class="leg sum"><span class="no"></span><span class="when">total</span>
     <span class="where">Booked so far</span>
     <span class="cost">$${grand.toLocaleString(undefined,{minimumFractionDigits:2})}</span></div>
   <div class="planfoot">Transatlantic airfare not included — send me the fare and I'll add it.</div>`;

document.getElementById('flights').innerHTML =
  '<h2>Flights</h2>' +
  FLIGHTS.map(f=>`<div class="fdir">
      <div class="lbl">${f.label}</div>
      <div class="day">${f.day}</div>
      ${f.hops.map(h=>`<div class="hop">
          <span class="code">${h.code}</span>
          <span class="path">${h.path}</span>
          <span class="time">${h.dep} → ${h.arr}</span>
        </div>
        <div class="hopsub">${h.sub}</div>`).join('')}
      <div class="fmeta">${f.meta}</div>
    </div>`).join('');

let fav = {};
try { fav = JSON.parse(localStorage.getItem('italy2026-fav')||'{}'); } catch(e){ fav = {}; }

app.innerHTML = TRIP.map((city,ci)=>{
  const s = city.stay;
  const stayLinks = (s.url ? `<a href="${s.url}" target="_blank" rel="noopener">BOOKING</a>` : '') +
    `<a href="https://www.google.com/maps/search/?api=1&query=${enc(s.addr ? s.addr+', Italy' : s.hotel+', '+city.name+', Italy')}" target="_blank" rel="noopener">${s.addr?'DIRECTIONS':'MAP'}</a>`;
  const stayRows = (s.addr ? [['Address', s.addr]] : []).concat(s.rows || []);

  const groups = city.groups.map((g,gi)=>{
    let body = '';
    if (g.prio){
      body = '<ol class="prio">' + g.prio.map(p=>`<li>${p}</li>`).join('') + '</ol>';
      if (g.note) body += `<div class="aside">${g.note}</div>`;
    } else {
      body = g.items.map(it=>{
        const key = city.id+'|'+it.n;
        const query = it.q || (it.n+', '+city.name+', Italy');
        const tag = it.tag ? `<span class="tag ${TAGS[it.tag][0]}">${TAGS[it.tag][1]}</span>` : '';
        return `<div class="item${it.avoid?' avoid':''}${it.tag==='booked'?' booked-row':''}" data-s="${(it.n+' '+it.d).toLowerCase().replace(/["“”]/g,'')}">
          <div class="hd">
            <h3>${tag}${it.n}</h3>
            <button class="star" data-k="${key}" aria-pressed="${fav[key]?'true':'false'}" aria-label="Save ${it.n}">${fav[key]?'★':'☆'}</button>
          </div>
          <p>${it.d}</p>
          ${it.dist ? `<div class="dist"><b>From your stay</b>${it.dist}</div>` : ''}
          <div class="out">
            <a href="https://www.google.com/maps/search/?api=1&query=${enc(query)}" target="_blank" rel="noopener">MAP</a>
            <a href="https://www.google.com/search?tbm=isch&q=${enc(query)}" target="_blank" rel="noopener">PHOTOS</a>
            <a href="https://www.google.com/search?q=${enc(query)}" target="_blank" rel="noopener">INFO</a>
          </div>
        </div>`;
      }).join('');
    }
    const count = g.prio ? g.prio.length : g.items.length;
    return `<details class="grp"${gi===0?' open':''}>
      <summary><span>${g.title}</span><span class="n">${count}</span><span class="chev">▼</span></summary>
      ${body}
    </details>`;
  }).join('');

  return `<section id="${city.id}">
    <div class="city">
      <div class="pad">
        <div class="stopno">${ci+1}</div>
        <div>
          <div class="region">${city.region}</div>
          <h2>${city.name}</h2>
          <p class="intro">${city.intro}</p>
        </div>
      </div>
      <div class="stay">
        <div class="row">
          <span class="dates">${s.in} → ${s.out}</span>
          <span class="n">${s.nights} night${s.nights>1?'s':''}</span>
          <span class="cost">${s.cost}</span>
        </div>
        <div class="hotel">${s.hotel}</div>
        ${s.sub ? `<div class="sub">${s.sub}</div>` : ''}
        ${stayRows.length ? '<dl>'+stayRows.map(r=>`<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('')+'</dl>' : ''}
        <div class="out">${stayLinks}</div>
      </div>
    </div>
    ${groups}
  </section>`;
}).join('');

/* ── Phrasebook section ── */
app.insertAdjacentHTML('beforeend', `<section id="italiano">
  <div class="city">
    <div class="pad">
      <div class="stopno">IT</div>
      <div>
        <div class="region">Say it in Italian</div>
        <h2>Phrases that actually come up</h2>
        <p class="intro">Enough to order, ask directions and be polite. Say the stressed CAPS a touch harder and you'll be understood.</p>
      </div>
    </div>
  </div>
  ${PHRASES.map((g,gi)=>`<details class="grp"${gi===0?' open':''}>
      <summary><span>${g.title}</span><span class="n">${g.items.length}</span><span class="chev">▼</span></summary>
      ${g.items.map(p=>`<div class="ph item" data-s="${(p.en+' '+p.it+' '+(p.tip||'')).toLowerCase().replace(/["“”']/g,'')}">
          <div class="en">${p.en}</div>
          <div class="it">${p.it}</div>
          <div class="say">${p.say}</div>
          ${p.tip ? `<div class="tip">${p.tip}</div>` : ''}
        </div>`).join('')}
    </details>`).join('')}
  <details class="grp">
    <summary><span>🤝 Things worth knowing</span><span class="n">${CUSTOMS.length}</span><span class="chev">▼</span></summary>
    ${CUSTOMS.map(c=>`<div class="headsup item" data-s="${(c.h+' '+c.p).toLowerCase().replace(/["“”']/g,'')}">
        <h3>${c.h}</h3><p>${c.p}</p>
      </div>`).join('')}
  </details>
</section>`);

/* ═══════════════════ BEHAVIOR ═══════════════════ */
jump.addEventListener('change', e=>{
  const el = document.getElementById(e.target.value);
  if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
  e.target.selectedIndex = 0;
});

app.addEventListener('click', e=>{
  const b = e.target.closest('.star');
  if (!b) return;
  const on = b.getAttribute('aria-pressed') === 'true';
  b.setAttribute('aria-pressed', on ? 'false' : 'true');
  b.textContent = on ? '☆' : '★';
  if (on) delete fav[b.dataset.k]; else fav[b.dataset.k] = 1;
  try { localStorage.setItem('italy2026-fav', JSON.stringify(fav)); } catch(e){}
});

const q = document.getElementById('q');
const none = document.getElementById('none');
const plan = document.getElementById('plan');
q.addEventListener('input', ()=>{
  const t = q.value.trim().toLowerCase();
  plan.style.display = t ? 'none' : '';
  let hitsAll = 0;
  document.querySelectorAll('section').forEach(sec=>{
    let secHits = 0;
    sec.querySelectorAll('details.grp').forEach(g=>{
      let hits = 0;
      g.querySelectorAll('.item').forEach(it=>{
        const ok = !t || it.dataset.s.includes(t);
        it.style.display = ok ? '' : 'none';
        if (ok) hits++;
      });
      if (g.querySelector('ol.prio')) { g.style.display = t ? 'none' : ''; return; }
      g.style.display = hits ? '' : 'none';
      if (t) g.open = hits > 0;
      secHits += hits;
    });
    sec.style.display = (!t || secHits) ? '' : 'none';
    hitsAll += secHits;
  });
  none.style.display = (t && !hitsAll) ? 'block' : 'none';
});

const up = document.getElementById('up');
addEventListener('scroll', ()=>{ up.style.display = scrollY > 700 ? 'flex' : 'none'; }, {passive:true});
up.addEventListener('click', ()=> scrollTo({top:0, behavior:'smooth'}));
</script>
